name: tests

# Manual trigger only. The project runs on a GitHub free plan used for
# storage; the audit evidence is the pytest log committed with each stage
# (docs/test_logs/). Re-enable push/pull_request triggers if Actions minutes
# become available.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: MPI runtime required by the LAMMPS wheel
        run: sudo apt-get update && sudo apt-get install -y libmpich12
      - name: Install package
        run: pip install -e ".[dev,lammps]"
      - name: Record environment
        run: pip freeze | tee pip-freeze.txt
      - name: Run tests
        run: |
          set -o pipefail
          pytest -v 2>&1 | tee pytest.log
      - name: Upload test log (audit trail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.sha }}
          path: |
            pytest.log
            pip-freeze.txt
