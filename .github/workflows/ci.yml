name: tests

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "chore/**", "release/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: MPI runtime required by the LAMMPS wheel
        run: sudo apt-get update && sudo apt-get install -y libmpich12
      - name: Install package
        run: pip install -e ".[dev,lammps,mof]"
      - name: Record environment
        run: pip freeze | tee pip-freeze.txt
      - name: Run tests
        run: |
          set -o pipefail
          pytest -v 2>&1 | tee pytest.log
      - name: Upload test log (audit trail)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-log-${{ github.sha }}
          path: |
            pytest.log
            pip-freeze.txt
