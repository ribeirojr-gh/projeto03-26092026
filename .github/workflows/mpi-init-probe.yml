# Temporary diagnostic (branch chore/18-ci-flake only): does creating a LAMMPS
# instance (MPICH singleton init) fail intermittently on the runner, and does
# restricting UCX to local transports prevent it?
# Run 1 (36333300706): 2 of 6 jobs died with exit code 15 after
# "ucx_init.c 38 init_worker Input/output error" (singleton and mpiexec alike).
name: mpi-init-probe
on:
  push:
    branches: [chore/18-ci-flake]
    paths: [.github/workflows/mpi-init-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: ["default", "ucx-local"]
        replica: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: MPI runtime
        run: sudo apt-get update && sudo apt-get install -y libmpich12
      - name: LAMMPS wheel
        run: pip install "lammps>=2023.8.2"
      - name: 200 fresh processes creating a LAMMPS instance
        shell: bash
        run: |
          set +e
          if [ "${{ matrix.variant }}" = "ucx-local" ]; then export UCX_TLS=self,sm; fi
          fails=0
          for i in $(seq 200); do
            python -c "import lammps; lammps.lammps(cmdargs=['-log','none','-screen','none']).close()" > out.txt 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then fails=$((fails+1)); echo "run $i exit $rc: $(grep -m1 -o 'ucx[^)]*' out.txt)"; fi
          done
          echo "FAILURES ${{ matrix.variant }} ${{ matrix.replica }}: $fails / 200"
