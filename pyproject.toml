[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-reaxff"
version = "0.2.0"
description = "Genetic-algorithm parametrization of ReaxFF force fields, with LAMMPS as the evaluation engine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "ase>=3.22"]

[project.optional-dependencies]
lammps = ["lammps>=2023.8.2"]
mof = ["pymatgen>=2024.1", "mpcontribs-client>=5.10", "matplotlib>=3.7"]
dev = ["pytest>=7"]

[project.scripts]
ga-reaxff = "ga_reaxff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end runs (deselect with -m 'not slow')"]
